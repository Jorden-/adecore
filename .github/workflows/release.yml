name: 🚀 Release

# Releases are immutable once published, so this workflow fills a draft and publishes it last.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.0 or 1.2.0-beta.1); its draft release must exist'
        required: true
        type: string

# Two runs for one version would both move its tag and publish; the second waits for the first instead.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: read
  # npm Trusted Publishing: npm trades this token for a short-lived publish credential, so no npm token is stored.
  id-token: write

jobs:
  release-info:
    name: Validate release identity
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid release version."
              exit 1
          fi
          tag="v$version"
          if ! release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease); then
              echo "::error::Create the draft release $tag first."
              exit 1
          fi
          if [[ "$(jq -r .isDraft <<< "$release")" != true ]]; then
              echo "::error::Release $tag is already published and can no longer take assets."
              exit 1
          fi
          # The npm tag follows the version, so a flag that disagrees would publish under one tag and show the other on GitHub.
          prerelease=$(jq -r .isPrerelease <<< "$release")
          if [[ "${version%%+*}" == *-* ]]; then
              expected=true
          else
              expected=false
          fi
          if [[ "$prerelease" != "$expected" ]]; then
              if [[ "$expected" == true ]]; then
                  echo "::error::Version $version is a prerelease, so mark the draft release $tag as a prerelease."
              else
                  echo "::error::Version $version is stable, so the draft release $tag must not be marked as a prerelease."
              fi
              exit 1
          fi
          # A draft creates its tag only when it is published, so the tag is made here for the commit this run builds.
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2> /dev/null); then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          elif [[ "$existing" != "$GITHUB_SHA" ]]; then
              # The release is still a draft, so nothing published points at the tag yet.
              echo "::notice::Moving tag $tag from $existing to $GITHUB_SHA."
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          fi
          {
              echo "version=$version"
              echo "tag=$tag"
              echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # The helper is native, so it is built once per platform on a runner of that platform. Ubuntu 22.04 keeps the glibc floor of the Linux binaries low.
  helper:
    needs: release-info
    name: 🦀 Build the helper (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: database-darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            binary: adecore-database
          - package: database-linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: adecore-database
          - package: database-linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: adecore-database
          - package: database-win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: adecore-database.exe
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/database/helper
          key: ${{ matrix.target }}

      - name: 🔨 Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: packages/database/helper

      # Staged as `bin/<binary>` so the artifact unpacks straight into the folder of its package.
      - name: 📦️ Stage the binary
        shell: bash
        run: |
          mkdir -p stage/bin
          cp "packages/database/helper/target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/bin/

      - name: ⬆️ Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: stage
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [helper, release-info]
    name: 🚀 Publish to npm
    env:
      RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
      IS_PRERELEASE: ${{ needs.release-info.outputs.prerelease }}
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: ✨ Setup node 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: 📦️ Install dependencies
        run: bun install --frozen-lockfile

      # Normalize after install so the checked-in workspace lockfile remains valid.
      - name: ✏️ Version ${{ env.RELEASE_VERSION }}
        run: bun run release:version "$RELEASE_VERSION"

      # Before the tests: a test that imports another package of the repository reads its `dist`.
      - name: 🔨 Build
        run: bun run build

      - name: 🔍 Check and test
        run: |
          bun run check
          bun run test

      # One artifact per platform package, each holding `bin/`. After the check and the build so those never see a binary, before the publish so `files` picks it up.
      - name: ⬇️ Download the helper binaries
        uses: actions/download-artifact@v8
        with:
          pattern: database-*
          path: packages

      # An artifact loses the executable bit on upload.
      - name: 🔑 Make the helper binaries executable
        run: chmod +x packages/database-*/bin/adecore-database

      - name: 📦 Validate packed artifacts and consumers
        run: bun run test:pack
        env:
          ADECORE_REQUIRE_NATIVE_BINARIES: '1'

      - name: 📚 Check and build the docs
        run: |
          bun run --cwd docs typecheck
          bun run --cwd docs build

      - name: 🚀 Publish ${{ env.RELEASE_VERSION }}
        run: bun run release:publish "$RELEASE_VERSION"

      # A prerelease uploads a version of the docs without sending traffic to it; the live site stays on the last release.
      - name: 🚀 Publish the docs (prerelease)
        uses: cloudflare/wrangler-action@v3
        if: ${{ env.IS_PRERELEASE == 'true' }}
        with:
          accountId: 5e565cf9fa55b0eae1f8131903da2ca9
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --tag prerelease-${{ env.RELEASE_VERSION }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.141.0'

      - name: 🚀 Publish the docs
        uses: cloudflare/wrangler-action@v3
        if: ${{ env.IS_PRERELEASE != 'true' }}
        with:
          accountId: 5e565cf9fa55b0eae1f8131903da2ca9
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.141.0'

  # Last, so a release only goes public, and becomes immutable, once npm has every package.
  release:
    needs: [release-info, publish]
    runs-on: ubuntu-latest
    name: 🏷️ Publish the GitHub release
    permissions:
      contents: write
    steps:
      - name: 🏷️ Publish ${{ needs.release-info.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
