name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ${{ format('ci-{0}', github.ref) }}

permissions:
  contents: read

jobs:
  # The helper takes minutes to build, so it only builds when the push or the pull request touched it or what speaks to it.
  changes:
    runs-on: ubuntu-latest
    name: 🔎 What changed
    permissions:
      contents: read
      pull-requests: read
    outputs:
      helper: ${{ steps.filter.outputs.helper }}
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6

      - name: 🔎 Filter the paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            helper:
              - 'packages/database/helper/**'
              - 'packages/database/fixtures/**'
              - 'packages/database/src/protocol/**'
              - 'packages/database/src/host/**'
              - 'packages/database/src/client/**'
              - 'packages/database/src/ddl/**'
              - 'packages/database/src/helper.integration.test.ts'
              - '.github/workflows/ci.yml'
              - 'helper.bunfig.toml'
              - 'package.json'
              - 'bun.lock'

  verify:
    runs-on: ubuntu-latest
    name: ✅ TypeScript checks and tests
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 📦️ Install dependencies
        run: bun install --frozen-lockfile

      # Before the tests: a test that imports another package of the repository reads its `dist`.
      - name: 🔨 Build
        run: bun run build

      - name: 🔍 Check
        run: bun run check

      - name: 🧪 Test
        run: bun run test

  docs:
    runs-on: ubuntu-latest
    name: 📚 Check and build the docs
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 📦️ Install dependencies
        run: bun install --frozen-lockfile
      - name: 📚 Check and build the docs
        run: |
          bun run --cwd docs typecheck
          bun run --cwd docs build

  helper-integration:
    runs-on: ubuntu-latest
    name: 🔗 Database client, host and helper
    needs: changes
    if: needs.changes.outputs.helper == 'true'
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 📦️ Install dependencies
        run: bun install --frozen-lockfile
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/database/helper
          # Reuse the release dependencies cached by the former check job.
          shared-key: check
      - name: 🦀 Build the database helper
        run: bun run --cwd packages/database helper:build
      - name: 🧪 Test the database client, host and helper
        run: bun run test:helper
        env:
          ADECORE_REQUIRE_DATABASE_HELPER: '1'

  helper:
    runs-on: ubuntu-latest
    name: 🦀 Database helper
    needs: changes
    if: needs.changes.outputs.helper == 'true'
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 33061:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 33062:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest" --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: packages/database/helper
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/database/helper

      - name: 🔍 Check
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      # Run the full suite once; only MySQL and its SSH tunnel need both server implementations.
      - name: 🧪 Test against MariaDB
        run: cargo test --locked
        env:
          ADECORE_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:33061

      - name: 🧪 Test against MySQL
        run: cargo test --locked --test mysql --test tunnel_ssh
        env:
          ADECORE_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:33062

  pack:
    runs-on: ubuntu-latest
    name: 📦 Build and pack workspaces
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: ✨ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔨 Build packages
        run: bun run build
      - name: 📦 Pack workspaces
        run: bun run pack "$RUNNER_TEMP/packed-workspaces"
      - name: ⬆️ Upload packed workspaces
        uses: actions/upload-artifact@v7
        with:
          name: packed-workspaces
          path: |
            ${{ runner.temp }}/packed-workspaces/*.tgz
            ${{ runner.temp }}/packed-workspaces/packages.json
          if-no-files-found: error
          retention-days: 1

  packages:
    runs-on: ubuntu-latest
    name: 📦 Packed consumers (Node ${{ matrix.node }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: ✨ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: ⬇️ Download packed workspaces
        uses: actions/download-artifact@v8
        with:
          name: packed-workspaces
          path: ${{ runner.temp }}/packed-workspaces
      - name: 🧪 Validate packed exports and Node/Bun consumers
        run: bun run test:pack --artifacts "$RUNNER_TEMP/packed-workspaces"

  check:
    runs-on: ubuntu-latest
    name: ✅ Check, test and build
    if: ${{ always() }}
    needs: [changes, verify, docs, helper-integration, helper, pack, packages]
    steps:
      - name: Check all results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$RESULTS"
