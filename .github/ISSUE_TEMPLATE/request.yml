name: Request
description: Something an app needs from a package, such as a new component, prop, variant or shell API.
labels: ["Enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need in the words of the app. The package answers with a shape that fits any app, which may be a different API than the one proposed, or a no when the need belongs in the app.
  - type: dropdown
    id: consumer
    attributes:
      label: Which app is this for?
      options:
        - Ruimte
        - AfterMotion
        - Command Center
        - Other
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options:
        - agent-contracts
        - agents
        - agents-react
        - database
        - database-darwin-arm64
        - database-linux-arm64
        - database-linux-x64
        - database-win32-x64
        - diagram
        - drawing
        - editor
        - editor-core
        - editor-react
        - intelligent-ui
        - lsp
        - merge
        - plan
        - service
        - shell
        - terminal
        - ui
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong, the call sites in the app as `path:line`, and how the app works around it today.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: Wish
      description: The need as what a person does or sees, not a fix. A proposed API is optional; put it in a code block.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on the other apps
      description: The other apps' call sites of the same component, shell part or pattern that a change would touch, and whether it would change what they draw or break them. Say so when there are none.
    validations:
      required: true
  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking
      options:
        - label: This would change an API another app already uses. A maintainer adds the `Breaking` label and lists the call sites.
