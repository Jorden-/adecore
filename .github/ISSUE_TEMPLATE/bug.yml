name: Bug
description: A part of a package that does not do what its docs or its types say.
labels: ["Bug"]
body:
  - type: dropdown
    id: consumer
    attributes:
      label: Which app is this for?
      options:
        - Ruimte
        - AfterMotion
        - Command Center
        - Other
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options:
        - agent-contracts
        - agents
        - agents-react
        - database
        - database-darwin-arm64
        - database-linux-arm64
        - database-linux-x64
        - database-win32-x64
        - diagram
        - drawing
        - editor
        - editor-core
        - editor-react
        - intelligent-ui
        - lsp
        - merge
        - plan
        - service
        - shell
        - terminal
        - ui
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest piece of code that shows it, or the file and line in the app.
      render: ts
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on the other app
      description: Whether the other app uses the same component or shell part in the same way, with its call sites, or that it does not.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version from npm, or the commit of a linked checkout.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or shell
      description: Such as Chrome 142 on macOS, or an Electron shell and its version.
